version: '3.8'

services:
  cadastre-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    # Les secrets sont injectes via l'environnement de la plateforme (Dokploy)
    # ou un fichier .env non versionne place a cote de ce compose.
    # Aucune valeur sensible ne doit etre committee ici.
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MASTER_API_KEY=${MASTER_API_KEY}
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
